name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Validate browser extension JavaScript
        run: |
          node --check browser-extension/firefox/background.js
          node --check browser-extension/chromium/background.js
          node --check browser-extension/firefox/popup.js
          node --check browser-extension/chromium/popup.js

      - name: Validate browser manifests and Python scripts
        run: |
          python -c "import json, pathlib; [json.loads(p.read_text()) for p in pathlib.Path('.').glob('browser-extension/*/manifest.json')]"
          python -c "import json, pathlib; [json.loads(p.read_text()) for p in pathlib.Path('native-host').glob('*.json.example')]"
          python -m compileall -q app scripts tests

      - name: Run tests
        run: python -m pytest -v

  ffmpeg-integration:
    name: FFmpeg stream integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run real FFmpeg stream integration tests
        run: python -m pytest -v tests/test_media_stream_integration.py tests/test_dash_media_stream_integration.py tests/test_hls_aes_integration.py
