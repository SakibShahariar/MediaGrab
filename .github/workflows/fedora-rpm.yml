name: Fedora RPM

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rpm:
    name: Build RPM in Fedora
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare RPM source archive
        run: |
          mkdir -p "$RUNNER_TEMP/mediagrab-rpmbuild/SOURCES"
          tar --exclude=.git --transform='s,^,MediaGrab-0.1.0/,' \
            -czf "$RUNNER_TEMP/mediagrab-rpmbuild/SOURCES/v0.1.0.tar.gz" .

      - name: Build and validate Fedora RPM
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$RUNNER_TEMP/mediagrab-rpmbuild:/rpmbuild" \
            fedora:latest bash -euxo pipefail -c '
              dnf install -y rpm-build pyproject-rpm-macros python3-devel \
                python3-setuptools python3-pytest python3-gobject gtk4 libadwaita \
                ffmpeg-free desktop-file-utils appstream
              mkdir -p /rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
              cp /src/packaging/rpm/mediagrab.spec /rpmbuild/SPECS/
              rpmbuild -ba --define "_topdir /rpmbuild" /rpmbuild/SPECS/mediagrab.spec
              rpm -qpl /rpmbuild/RPMS/noarch/mediagrab-0.1.0-1*.noarch.rpm
            '
