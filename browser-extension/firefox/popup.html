<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MediaGrab</title><link rel="stylesheet" href="popup.css"></head>
<body><main><header><span class="mark">M</span><div><h1>MediaGrab</h1><p>Browser media capture</p></div></header>
